services:
  collaboration:
    build: .
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 1234
      COLLAB_DATA_DIR: /data
      COLLAB_CREATE_KEY: ${COLLAB_CREATE_KEY:?Run bash setup-mint.sh first}
    ports:
      - "${COLLAB_BIND:-127.0.0.1}:1234:1234"
    volumes:
      - projects:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2
    profiles: [internet]
    restart: unless-stopped
    depends_on:
      collaboration:
        condition: service_healthy
    environment:
      COLLAB_DOMAIN: ${COLLAB_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
volumes:
  projects:
  certificates:
  caddy-config:
